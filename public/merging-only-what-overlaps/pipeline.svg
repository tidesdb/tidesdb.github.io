<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="system-ui, sans-serif" font-size="13">
  <title>Sealed memtables queue, flush threads build them in parallel and install them in order, one L1 sorted run per column family</title>

  <g font-size="12" fill="#697386">
    <rect x="60" y="10" width="12" height="12" rx="2" fill="#193EDC"/><text x="78" y="21">users</text>
    <rect x="140" y="10" width="12" height="12" rx="2" fill="#809ae0"/><text x="158" y="21">orders</text>
    <rect x="226" y="10" width="12" height="12" rx="2" fill="#0a2540"/><text x="244" y="21">events</text>
    <text x="628" y="21" text-anchor="end">three column families sharing one memtable</text>
  </g>

  <g fill="#8792a2" font-size="12">
    <text x="60" y="48">active</text>
    <text x="220" y="48">immutable queue, oldest first</text>
    <text x="12" y="157">flush thread 1</text>
    <text x="12" y="207">flush thread 2</text>
    <text x="12" y="300">L1</text>
  </g>
  <g fill="#0a2540" font-weight="600" text-anchor="middle" font-size="12">
    <text x="130" y="276">users</text>
    <text x="320" y="276">orders</text>
    <text x="510" y="276">events</text>
  </g>

  <!-- the active memtable fills, then is sealed and joins the back of the queue -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
                      keyTimes="0;0.12;0.2;0.96;1" values="0 0;0 0;360 0;360 0;0 0"/>
    <rect x="60" y="56" width="90" height="26" rx="3" fill="none" stroke="#809ae0" stroke-width="2"/>
    <g>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.01;0.96;1" values="0;1;1;0"/>
      <rect x="60" y="56" height="26" fill="#193EDC" width="0">
        <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.11;1" values="0;40;40"/>
      </rect>
      <rect x="60" y="56" height="26" fill="#809ae0" width="0">
        <animate attributeName="x" dur="14s" repeatCount="indefinite" keyTimes="0;0.11;1" values="60;100;100"/>
        <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.11;1" values="0;30;30"/>
      </rect>
      <rect x="60" y="56" height="26" fill="#0a2540" width="0">
        <animate attributeName="x" dur="14s" repeatCount="indefinite" keyTimes="0;0.11;1" values="60;130;130"/>
        <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.11;1" values="0;20;20"/>
      </rect>
    </g>
  </g>
  <rect x="60" y="56" width="90" height="26" rx="3" fill="none" stroke="#809ae0" stroke-width="2" stroke-dasharray="4 3" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.22;0.96;1" values="0;0;1;1;0"/>
  </rect>
  <text x="105" y="100" text-anchor="middle" fill="#697386" font-size="11" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.22;0.96;1" values="0;0;1;1;0"/>
    fresh, on a new log
  </text>

  <!-- generation 7, oldest, claimed by thread 1 -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
                      keyTimes="0;0.26;0.34;1" values="0 0;0 0;0 90;0 90"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.62;0.65;0.97;1" values="1;1;0;0;1"/>
    <rect x="220" y="56" width="40" height="26" fill="#193EDC"/>
    <rect x="260" y="56" width="30" height="26" fill="#809ae0"/>
    <rect x="290" y="56" width="20" height="26" fill="#0a2540"/>
    <text x="265" y="96" text-anchor="middle" fill="#697386" font-size="11">gen 7</text>
  </g>
  <!-- generation 8, claimed by thread 2 -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
                      keyTimes="0;0.26;0.34;1" values="0 0;0 0;-100 140;-100 140"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.7;0.73;0.97;1" values="1;1;0;0;1"/>
    <rect x="320" y="56" width="40" height="26" fill="#193EDC"/>
    <rect x="360" y="56" width="30" height="26" fill="#809ae0"/>
    <rect x="390" y="56" width="20" height="26" fill="#0a2540"/>
    <text x="365" y="96" text-anchor="middle" fill="#697386" font-size="11">gen 8</text>
  </g>
  <text x="465" y="96" text-anchor="middle" fill="#697386" font-size="11" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.22;0.96;1" values="0;0;1;1;0"/>
    gen 9, waiting
  </text>

  <!-- the builds, thread 2 finishing first -->
  <rect x="340" y="152" height="10" rx="3" fill="#193EDC" width="0">
    <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.36;0.6;0.65;1" values="0;0;200;0;0"/>
  </rect>
  <rect x="340" y="202" height="10" rx="3" fill="#193EDC" width="0">
    <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.36;0.5;0.7;0.73;1" values="0;0;200;200;0;0"/>
  </rect>
  <text x="340" y="232" fill="#193EDC" font-size="12" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.64;0.66;1" values="0;0;1;1;0;0"/>
    built first, waits for gen 7 to install
  </text>

  <!-- gen 7 installs, one L1 sorted run per family -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.62;0.65;0.97;1" values="0;0;1;1;0"/>
    <rect x="70" y="288" width="54" height="20" rx="3" fill="#193EDC"/>
    <rect x="260" y="288" width="54" height="20" rx="3" fill="#809ae0"/>
    <rect x="450" y="288" width="54" height="20" rx="3" fill="#0a2540"/>
    <g fill="#fff" font-size="10" text-anchor="middle">
      <text x="97" y="302">gen 7</text><text x="287" y="302">gen 7</text><text x="477" y="302">gen 7</text>
    </g>
  </g>
  <!-- then gen 8 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.7;0.73;0.97;1" values="0;0;1;1;0"/>
    <rect x="130" y="288" width="54" height="20" rx="3" fill="#193EDC"/>
    <rect x="320" y="288" width="54" height="20" rx="3" fill="#809ae0"/>
    <rect x="510" y="288" width="54" height="20" rx="3" fill="#0a2540"/>
    <g fill="#fff" font-size="10" text-anchor="middle">
      <text x="157" y="302">gen 8</text><text x="347" y="302">gen 8</text><text x="537" y="302">gen 8</text>
    </g>
  </g>
  <text x="320" y="334" text-anchor="middle" fill="#193EDC" font-size="12" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.76;0.79;0.96;0.98;1" values="0;0;1;1;0;0"/>
    each family now compacts its own L1 on its own schedule
  </text>

  <g fill="#697386" font-size="13">
    <text x="12" y="372" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.01;0.11;0.13;1" values="0;1;1;0;0"/>
      1. every family writes into one memtable, its keys kept together in its own slot
    </text>
    <text x="12" y="398" font-size="12" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.01;0.11;0.13;1" values="0;1;1;0;0"/>
      a key carries its family's index in front, so the sorted memtable groups them in index order
    </text>
    <text x="12" y="372" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.13;0.15;0.25;0.27;1" values="0;0;1;1;0;0"/>
      2. once full it is sealed onto the queue, still readable, and a fresh one takes writes
    </text>
    <text x="12" y="372" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.27;0.29;0.48;0.5;1" values="0;0;1;1;0;0"/>
      3. each flush thread claims the oldest one nobody has and builds it, side by side
    </text>
    <text x="12" y="372" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.6;0.62;1" values="0;0;1;1;0;0"/>
      4. builds finish in any order, but they install in the order they were claimed
    </text>
    <text x="12" y="372" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.62;0.64;0.96;0.98;1" values="0;0;1;1;0;0"/>
      5. each build cuts its memtable into one sorted run per family, installed in one commit
    </text>
    <text x="12" y="398" font-size="12" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.64;0.67;0.96;0.98;1" values="0;0;1;1;0;0"/>
      then the memtable leaves the queue, its log is let go, and compaction is woken
    </text>
  </g>
</svg>
