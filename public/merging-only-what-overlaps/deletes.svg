<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="system-ui, sans-serif" font-size="13">
  <title>A tombstone is carried to the largest level, a single-delete drops with its put, a range delete rides with its sorted run</title>

  <g font-size="12" fill="#697386">
    <rect x="60" y="10" width="12" height="12" rx="2" fill="#0a2540"/><text x="78" y="21">a delete</text>
    <rect x="150" y="10" width="12" height="12" rx="2" fill="#b4dbf7"/><text x="168" y="21">an older value it removes</text>
  </g>
  <g fill="#0a2540" font-weight="600" text-anchor="middle">
    <text x="135" y="48">delete</text>
    <text x="330" y="48">single-delete</text>
    <text x="525" y="48">range delete</text>
  </g>
  <g fill="#8792a2">
    <text x="12" y="84">L1</text>
    <text x="12" y="144">L2</text>
    <text x="12" y="204">L3</text>
    <text x="12" y="220" font-size="11">largest</text>
  </g>
  <g stroke="#8792a2" stroke-opacity="0.4">
    <line x1="44" y1="100" x2="628" y2="100"/>
    <line x1="44" y1="160" x2="628" y2="160"/>
    <line x1="44" y1="226" x2="628" y2="226"/>
  </g>

  <!-- a plain delete travels to L3 and drops there with the value it shadows -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite"
                      keyTimes="0;0.22;0.32;0.55;0.65;1" values="0 0;0 0;0 60;0 60;0 120;0 120"/>
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
             keyTimes="0;0.7;0.76;0.95;1" values="1;1;0;0;1"/>
    <rect x="105" y="66" width="60" height="24" rx="3" fill="#0a2540"/>
    <text x="135" y="83" text-anchor="middle" fill="#fff" font-size="12">del k</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
             keyTimes="0;0.7;0.76;0.95;1" values="1;1;0;0;1"/>
    <rect x="105" y="186" width="60" height="24" rx="3" fill="#b4dbf7"/>
    <text x="135" y="203" text-anchor="middle" fill="#0a2540" font-size="12">k = old</text>
  </g>

  <!-- a single-delete meets its put at L2 and both go -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite"
                      keyTimes="0;0.22;0.32;1" values="0 0;0 0;0 60;0 60"/>
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
             keyTimes="0;0.36;0.42;0.95;1" values="1;1;0;0;1"/>
    <rect x="268" y="66" width="60" height="24" rx="3" fill="#0a2540"/>
    <text x="298" y="83" text-anchor="middle" fill="#fff" font-size="12">sdel k</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
             keyTimes="0;0.36;0.42;0.95;1" values="1;1;0;0;1"/>
    <rect x="334" y="126" width="60" height="24" rx="3" fill="#b4dbf7"/>
    <text x="364" y="143" text-anchor="middle" fill="#0a2540" font-size="12">k = old</text>
  </g>

  <!-- a range delete rides in its sorted run to L3, where the keys it covers go and so does it -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite"
                      keyTimes="0;0.22;0.32;0.55;0.65;1" values="0 0;0 0;0 60;0 60;0 120;0 120"/>
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
             keyTimes="0;0.7;0.76;0.95;1" values="1;1;0;0;1"/>
    <rect x="460" y="66" width="130" height="24" rx="3" fill="#0a2540"/>
    <text x="525" y="83" text-anchor="middle" fill="#fff" font-size="12">del j up to m</text>
  </g>
  <g font-size="12" fill="#0a2540" text-anchor="middle">
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
             keyTimes="0;0.7;0.76;0.95;1" values="1;1;0;0;1"/>
    <rect x="470" y="186" width="34" height="24" rx="3" fill="#b4dbf7"/>
    <rect x="508" y="186" width="34" height="24" rx="3" fill="#b4dbf7"/>
    <rect x="546" y="186" width="34" height="24" rx="3" fill="#b4dbf7"/>
    <text x="487" y="203">j</text>
    <text x="525" y="203">k</text>
    <text x="563" y="203">l</text>
  </g>

  <!-- space freed -->
  <text x="12" y="262" fill="#8792a2">space freed</text>
  <rect x="100" y="250" height="16" rx="3" fill="#193EDC" width="0">
    <animate attributeName="width" dur="11s" repeatCount="indefinite"
             keyTimes="0;0.36;0.42;0.7;0.76;0.95;1" values="0;0;120;120;500;500;0"/>
  </rect>

  <g fill="#697386" font-size="13">
    <text x="12" y="300" opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.02;0.2;0.23;1" values="0;1;1;0;0"/>
      1. each kind of delete starts above the older data it removes
    </text>
    <text x="12" y="300" opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.23;0.26;0.5;0.53;1" values="0;0;1;1;0;0"/>
      2. a merge moves them down, and a single-delete that meets its put drops with it at once
    </text>
    <text x="12" y="300" opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.53;0.56;0.68;0.71;1" values="0;0;1;1;0;0"/>
      3. a delete or a range may still have older copies beneath it, so they keep going
    </text>
    <text x="12" y="300" opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.71;0.74;0.94;0.97;1" values="0;0;1;1;0;0"/>
      4. at the largest level nothing older is left below, so they go with what they covered
    </text>
  </g>
</svg>
